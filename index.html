<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>PECS Lab | Allenamento INPS 2026</title>
<style>
:root{font-family:Inter,system-ui,Arial,sans-serif;color:#18243b;background:#f4f7fc}*{box-sizing:border-box}body{margin:0}header{background:#172f5f;color:#fff;padding:25px max(20px,calc((100vw - 960px)/2))}header h1{margin:0}header p{color:#ccdaf4}main{max-width:960px;margin:25px auto;padding:0 16px}.card{background:#fff;border:1px solid #dce4ef;border-radius:14px;padding:23px;margin-bottom:17px;box-shadow:0 5px 18px #14265009}.muted{color:#64748b}.pill{display:inline-block;background:#e5edf9;border-radius:40px;padding:5px 12px;font-size:12px;font-weight:650}nav{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}button,select{font:inherit}button{background:#2357bc;color:white;border:0;border-radius:9px;padding:12px 16px;cursor:pointer}button.secondary{background:#e9eef7;color:#213a63}button:disabled{opacity:.45;cursor:not-allowed}button:hover:not(:disabled){filter:brightness(.94)}button.choice{display:block;width:100%;text-align:left;background:#f5f8fc;color:#172a46;border:1px solid #d8e1ed;margin:9px 0;padding:14px}.choice.selected{background:#dceafe;border-color:#4778cf}.choice.right{background:#d8f4e5;border-color:#43916b}.choice.wrong{background:#ffe2e2;border-color:#c86666}.flex{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.space{justify-content:space-between}.bar{height:9px;background:#e3e9f2;border-radius:9px;overflow:hidden}.bar span{display:block;height:100%;background:#3977cc}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}.stat{background:#f1f6fc;border-radius:12px;padding:15px}select{padding:11px;border:1px solid #cbd5e1;border-radius:9px;max-width:100%}details{margin-top:12px}footer{max-width:960px;margin:30px auto;padding:20px;color:#718096;font-size:13px}.hidden{display:none}#timer{font-weight:750;font-variant-numeric:tabular-nums}@media(max-width:550px){header{padding:20px}main{margin:12px auto}.card{padding:16px}}
</style></head>
<body><header><h1>PECS Lab</h1><p>Preparazione al concorso INPS 1.695 PECS · 2026</p><span class="pill">Banca dati originale di esercitazione — non ufficiale</span></header>
<main><nav><button id="homeBtn" class="secondary">Panoramica</button><button id="practiceBtn" class="secondary">Allenamento</button><button id="examBtn" class="secondary">Simulazione</button><button id="errorsBtn" class="secondary">Ripasso errori</button><button id="statsBtn" class="secondary">Statistiche</button></nav><div id="view"></div></main>
<footer>Questo sito è indipendente dall'INPS. Le simulazioni non riproducono una banca dati ufficiale. Le risposte non vengono inviate a un server; il progresso resta nel browser.</footer>
<script src="data/questions.js"></script>
<script src="data/logic-extra.js"></script>
<script src="data/verbal-extra.js"></script>
<script src="data/english-extra.js"></script>
<script src="data/computing-extra.js"></script>
<script src="data/culture-extra.js"></script>
<script>
"use strict";
const blueprints=[["logica",15],["verbale",10],["inglese",10],["informatica",10],["cultura",15]];
const names={logica:"Logica",verbale:"Comprensione e ragionamento verbale",inglese:"Lingua inglese",informatica:"Competenze informatiche",cultura:"Cultura generale"};
const BANK=(window.PECS_QUESTIONS||[]).filter(q=>q&&q.id&&names[q.subject]&&Array.isArray(q.choices)&&q.choices.length===4&&Number.isInteger(q.correct)&&q.correct>=0&&q.correct<4);
const view=document.getElementById("view");let run=null,tick=null;
let history=(()=>{try{return JSON.parse(localStorage.getItem("pecs-history-v1"))||[]}catch{return []}})();

const ACTIVE_KEY="pecs-active-v1";
let storageOk=true;
function persist(){
 try{localStorage.setItem("pecs-history-v1",JSON.stringify(history));storageOk=true;return true}
 catch{storageOk=false;alert("Impossibile salvare la cronologia in questo browser. Esporta subito un backup dalle Statistiche.");return false}
}
function loadSnapshot(){
 try{
  const saved=JSON.parse(localStorage.getItem(ACTIVE_KEY));
  if(!saved||saved.version!==1||!Array.isArray(saved.ids)||saved.ids.length===0||saved.ids.length>500||!Number.isInteger(saved.idx)||typeof saved.exam!=="boolean")return null;
  return saved;
 }catch{return null}
}
function saveSnapshot(){
 if(!run||run.finished)return false;
 const snap={version:1,ids:run.qs.map(q=>q.id),answers:run.answers,idx:run.idx,exam:run.exam,deadline:run.deadline,startedAt:run.startedAt,timings:run.timings,updatedAt:Date.now()};
 try{localStorage.setItem(ACTIVE_KEY,JSON.stringify(snap));storageOk=true;return true}
 catch{storageOk=false;alert("Il salvataggio automatico non è disponibile. Controlla le impostazioni del browser.");return false}
}
function clearSnapshot(){try{localStorage.removeItem(ACTIVE_KEY)}catch{}}
function noteTiming(id){
 if(!run||!run.viewStarted)return;
 const now=Date.now();
 const elapsed=Math.max(0,Math.min(now-run.viewStarted,run.exam?3600000:1200000));
 if(elapsed>0)run.timings[id]=(run.timings[id]||0)+elapsed;
 run.viewStarted=now;
}
function confirmReplacement(){
 return !loadSnapshot()||confirm("Hai una sessione non conclusa. Iniziarne una nuova sostituirà il salvataggio corrente. Continuare?");
}
function resumeSession(){
 const saved=loadSnapshot();if(!saved){home();return}
 const lookup=new Map(BANK.map(q=>[q.id,q])),qs=saved.ids.map(id=>lookup.get(id));
 if(qs.some(q=>!q)){alert("Alcuni quesiti sono stati rimossi dalla banca dati. Questa sessione non può essere ripristinata; lo storico già concluso rimane salvato.");return}
 stop();
 const answers={},timings={};
 for(const q of qs){
  if(saved.answers&&Number.isInteger(saved.answers[q.id])&&saved.answers[q.id]>=0&&saved.answers[q.id]<4)answers[q.id]=saved.answers[q.id];
  if(saved.timings&&Number.isFinite(saved.timings[q.id])&&saved.timings[q.id]>=0)timings[q.id]=saved.timings[q.id];
 }
 run={qs,answers,idx:Math.max(0,Math.min(qs.length-1,saved.idx)),exam:saved.exam,deadline:saved.exam&&Number.isFinite(saved.deadline)?saved.deadline:null,startedAt:Number.isFinite(saved.startedAt)?saved.startedAt:Date.now(),timings,viewStarted:Date.now(),finished:false};
 if(run.exam&&run.deadline&&Date.now()>=run.deadline){finish();return}
 renderQuestion();if(run.exam)startTimer();
}
function startTimer(){
 stop();
 tick=setInterval(()=>{
  if(!run||run.finished)return;
  if(Date.now()>=run.deadline)finish();
  else {const el=document.getElementById("timer");if(el)el.textContent=clock()}
 },1000);
}

function esc(x){return String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function shuffle(a){const z=[...a];for(let i=z.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[z[i],z[j]]=[z[j],z[i]]}return z}
function stop(){if(tick)clearInterval(tick);tick=null}

function home(){
 stop();run=null;
 const saved=loadSnapshot();
 const resume=saved?'<section class="card"><h2>Sessione da riprendere</h2><p>È disponibile un allenamento salvato ('+(saved.exam?'simulazione':'esercitazione')+'). Risposte e posizione sono conservate anche dopo aver chiuso il browser.</p>'+(saved.exam?'<p class="muted">Attenzione: i 60 minuti continuano a decorrere anche a pagina chiusa. Se il tempo è scaduto, la simulazione sarà conclusa al ripristino.</p>':'')+'<div class="flex"><button id="resumeBtn">Riprendi sessione</button><button class="secondary" id="discardBtn">Elimina sessione incompleta</button></div></section>':'';
 const counts=blueprints.map(([s,n])=>'<tr><td>'+names[s]+'</td><td>'+n+'</td><td>'+BANK.filter(q=>q.subject===s).length+'</td></tr>').join('');
 view.innerHTML=resume+'<section class="card"><h2>La prova preselettiva</h2><p>27–30 ottobre 2026 · 60 quesiti · 60 minuti · quattro alternative, una esatta. Sono inoltre previsti cinque quesiti di riserva; questa funzione è ancora in preparazione.</p><p>La banca dati attuale contiene <b>'+BANK.length+'</b> quesiti originali di esercitazione (non ufficiali, da sottoporre a revisione). Le simulazioni richiedono sufficienti quesiti <b>unici</b> per tutte le materie.</p><table width="100%" cellspacing="12"><thead><tr><th align="left">Materia</th><th>All&#39;esame</th><th>Disponibili</th></tr></thead><tbody>'+counts+'</tbody></table><div class="flex"><button onclick="practice()">Allenati ora</button><button class="secondary" onclick="exam()">Simulazione</button></div></section><section class="card"><h2>Prova scritta</h2><p>9 novembre 2026: tre brani tecnico-giuridici, cinque quesiti di comprensione e due scenari situazionali, con tre alternative. Occorrono almeno 21/30 in ciascuna delle due sezioni.</p><p class="muted">Modulo scritto in preparazione: non confondere questa esercitazione preselettiva con la prova scritta.</p></section>';
 if(saved){
  document.getElementById("resumeBtn").onclick=resumeSession;
  document.getElementById("discardBtn").onclick=()=>{if(confirm("Eliminare la sessione incompleta? I test già conclusi rimarranno nello storico.")){clearSnapshot();home()}};
 }
}

function practice(){
 stop();run=null;
 view.innerHTML='<section class="card"><h2>Allenamento mirato</h2><p class="muted">Feedback e spiegazione immediata. Filtra per materia e, se vuoi, per sottoargomento.</p><div class="flex"><select id="topic"><option value="all">Tutte le materie</option>'+blueprints.map(([s])=>'<option value="'+s+'">'+names[s]+'</option>').join('')+'</select><select id="subtopic"><option value="all">Tutti i sottoargomenti</option></select><select id="amount"><option>5</option><option selected>10</option><option>20</option><option>40</option></select><button id="startPractice">Inizia</button></div></section>';
 const subjectEl=document.getElementById("topic"),subEl=document.getElementById("subtopic");
 function updateSubtopics(){
  const s=subjectEl.value,topics=[...new Set(BANK.filter(q=>s==="all"||q.subject===s).map(q=>q.topic).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"it"));
  subEl.innerHTML='<option value="all">Tutti i sottoargomenti</option>'+topics.map(t=>'<option value="'+esc(t)+'">'+esc(t)+'</option>').join('');
 }
 subjectEl.onchange=updateSubtopics;updateSubtopics();
 document.getElementById("startPractice").onclick=()=>{
  const s=subjectEl.value,t=subEl.value,n=+document.getElementById("amount").value;
  const pool=shuffle(BANK.filter(q=>(s==="all"||q.subject===s)&&(t==="all"||q.topic===t))).slice(0,n);
  start(pool,false);
 };
}
function exam(){stop();run=null;const missing=blueprints.filter(([s,n])=>BANK.filter(q=>q.subject===s).length<n);view.innerHTML='<section class="card"><h2>Simulazione realistica</h2><p>60 quesiti / 60 minuti, distribuzione ufficiale 15–10–10–10–15. Il modulo per cinque quesiti di riserva non è ancora implementato.</p>'+(missing.length?'<p><b>Non ancora disponibile:</b> servono altri quesiti per: '+missing.map(([s,n])=>names[s]+' ('+(n-BANK.filter(q=>q.subject===s).length)+' mancanti)').join('; ')+'.</p><p class="muted">Per ora usa Allenamento: non riempiremo artificialmente la simulazione con duplicati.</p>':'<button onclick="startExam()">Avvia simulazione</button>')+'</section>'}
function startExam(){
 const seen=new Set(history.filter(h=>h.mode==="exam").flatMap(h=>(h.questions||[]).map(q=>q.id)));
 const qs=blueprints.flatMap(([s,n])=>{
  const pool=BANK.filter(q=>q.subject===s);
  const unseen=shuffle(pool.filter(q=>!seen.has(q.id))),previous=shuffle(pool.filter(q=>seen.has(q.id)));
  return unseen.concat(previous).slice(0,n);
 });
 start(shuffle(qs),true);
}

function start(qs,examMode){
 if(!qs.length){view.innerHTML='<section class="card">Nessun quesito disponibile.</section>';return}
 if(!confirmReplacement())return;
 stop();
 const now=Date.now();
 run={qs,answers:{},idx:0,exam:examMode,finished:false,deadline:examMode?now+3600000:null,startedAt:now,timings:{},viewStarted:now};
 saveSnapshot();renderQuestion();
 if(examMode)startTimer();
}

function clock(){return Math.max(0,Math.ceil((run.deadline-Date.now())/1000)).toString().toString().replace(/^([0-9]+)$/,(_,x)=>String(Math.floor(+x/60)).padStart(2,"0")+":"+String(+x%60).padStart(2,"0"))}

function renderQuestion(){
 if(!run)return;
 const q=run.qs[run.idx],chosen=run.answers[q.id],answered=chosen!==undefined,show=!run.exam&&answered;
 view.innerHTML='<section class="card"><div class="flex space"><span class="pill">'+esc(names[q.subject])+'</span><span id="timer">'+(run.exam?clock():"Allenamento")+'</span></div><h2>Quesito '+(run.idx+1)+' / '+run.qs.length+'</h2><div class="bar"><span style="width:'+((run.idx+1)/run.qs.length*100)+'%"></span></div><p style="font-size:1.13rem;line-height:1.6;white-space:pre-line">'+esc(q.question)+'</p><div id="choices">'+q.choices.map((c,i)=>'<button class="choice '+(chosen===i?'selected ':'')+(show?(i===q.correct?'right':i===chosen?'wrong':''):'')+'" data-i="'+i+'" '+(show?'disabled':'')+'>'+String.fromCharCode(65+i)+'. '+esc(c)+'</button>').join('')+'</div>'+(show?'<p><b>'+(chosen===q.correct?'Corretto!':'Risposta corretta: '+String.fromCharCode(65+q.correct))+'.</b> '+esc(q.explanation||'')+'</p>':'')+'<div class="flex space"><button class="secondary" id="prev" '+(run.idx===0?'disabled':'')+'>Precedente</button><button id="next">'+(run.idx===run.qs.length-1?'Concludi':'Successivo')+'</button><span class="muted" style="font-size:12px">Risposte salvate automaticamente</span></div></section>';
 document.querySelectorAll(".choice").forEach(el=>el.onclick=()=>{
  noteTiming(q.id);
  run.answers[q.id]=+el.dataset.i;saveSnapshot();renderQuestion();
 });
 document.getElementById("prev").onclick=()=>{
  noteTiming(q.id);run.idx--;run.viewStarted=Date.now();saveSnapshot();renderQuestion();
 };
 document.getElementById("next").onclick=()=>{
  noteTiming(q.id);
  if(run.idx<run.qs.length-1){run.idx++;run.viewStarted=Date.now();saveSnapshot();renderQuestion()}
  else finish();
 };
}


function finish(){
 if(!run||run.finished)return;
 noteTiming(run.qs[run.idx].id);
 run.finished=true;stop();
 const correct=run.qs.filter(q=>run.answers[q.id]===q.correct).length;
 const answered=run.qs.filter(q=>run.answers[q.id]!==undefined).length;
 const questions=run.qs.map(q=>({id:q.id,subject:q.subject,topic:q.topic||null,right:run.answers[q.id]===q.correct,answer:run.answers[q.id]??null,correctAnswer:q.correct,timeMs:Math.round(run.timings[q.id]||0)}));
 history.push({date:new Date().toISOString(),startedAt:new Date(run.startedAt).toISOString(),durationMs:Date.now()-run.startedAt,mode:run.exam?"exam":"practice",count:run.qs.length,correct,answered,questions});
 const saved=persist();if(saved)clearSnapshot();
 const wrong=run.qs.filter(q=>run.answers[q.id]!==q.correct);
 view.innerHTML='<section class="card"><h2>Risultati</h2><div class="stats"><div class="stat"><b>'+correct+' / '+run.qs.length+'</b><p>Corrette</p></div><div class="stat"><b>'+answered+'</b><p>Risposte date</p></div><div class="stat"><b>'+Math.round(100*correct/run.qs.length)+'%</b><p>Precisione</p></div></div>'+(saved?'<p class="muted">Risultati salvati in questo browser.</p>':'<p><b>Attenzione:</b> i risultati non sono stati salvati. Controlla le impostazioni del browser.</p>')+'<h3>Da ripassare</h3>'+(wrong.length?wrong.map(q=>'<details><summary>'+esc(q.question)+'</summary><p><b>'+esc(q.choices[q.correct])+'</b> — '+esc(q.explanation||'')+'</p></details>').join(''):'<p>Nessun errore.</p>')+'<div class="flex" style="margin-top:20px"><button onclick="practice()">Nuovo allenamento</button><button class="secondary" onclick="errors()">Ripasso errori</button><button class="secondary" onclick="stats()">Statistiche</button></div></section>';
}

function errors(){stop();run=null;const wrongIds=new Set(history.flatMap(h=>(h.questions||[]).filter(q=>!q.right).map(q=>q.id)));const qs=shuffle(BANK.filter(q=>wrongIds.has(q.id)));view.innerHTML='<section class="card"><h2>Ripasso errori</h2><p>'+qs.length+' quesiti sbagliati in almeno una sessione.</p><button '+(qs.length?'':'disabled')+' id="reviewStart">Ripassa ora</button></section>';document.getElementById("reviewStart").onclick=()=>start(qs,false)}

function stats(){
 stop();run=null;
 const count=history.reduce((n,h)=>n+(Number(h.count)||0),0);
 const correct=history.reduce((n,h)=>n+(Number(h.correct)||0),0);
 const breakdown={};
 for(const [subject] of blueprints)breakdown[subject]={total:0,right:0,time:0,timed:0};
 for(const session of history){
  for(const answer of session.questions||[]){
   if(!breakdown[answer.subject])continue;
   const s=breakdown[answer.subject];
   s.total++;if(answer.right)s.right++;
   if(Number.isFinite(answer.timeMs)&&answer.timeMs>0){s.time+=answer.timeMs;s.timed++}
  }
 }
 const breakdownRows=blueprints.map(([key])=>{
  const s=breakdown[key],rate=s.total?Math.round(s.right/s.total*100)+'%':'—';
  const seconds=s.timed?Math.round(s.time/s.timed/1000)+' s':'—';
  return '<tr><td>'+names[key]+'</td><td>'+s.total+'</td><td>'+rate+'</td><td>'+seconds+'</td></tr>';
 }).join('');
 const latest=[...history].reverse().slice(0,10).map(h=>{
  const date=new Date(h.date),when=Number.isNaN(date.getTime())?'—':date.toLocaleString("it-IT");
  return '<tr><td>'+esc(when)+'</td><td>'+(h.mode==='exam'?'Simulazione':'Allenamento')+'</td><td>'+Number(h.correct||0)+'/'+Number(h.count||0)+'</td></tr>'
 }).join('');
 const saved=loadSnapshot();
 view.innerHTML='<section class="card"><h2>Statistiche e cronologia</h2><div class="stats"><div class="stat"><b>'+history.length+'</b><p>Sessioni completate</p></div><div class="stat"><b>'+count+'</b><p>Quesiti svolti</p></div><div class="stat"><b>'+(count?Math.round(100*correct/count):0)+'%</b><p>Precisione complessiva</p></div></div><h3>Risultati per materia</h3><table width="100%" cellspacing="10"><thead><tr><th align="left">Materia</th><th>Risposte</th><th>Corrette</th><th>Tempo medio*</th></tr></thead><tbody>'+breakdownRows+'</tbody></table><p class="muted" style="font-size:12px">*Il tempo medio è disponibile soltanto per le risposte registrate dalla nuova versione.</p><h3>Ultime 10 sessioni</h3>'+(latest?'<table width="100%" cellspacing="10"><thead><tr><th align="left">Data</th><th>Tipo</th><th>Risultato</th></tr></thead><tbody>'+latest+'</tbody></table>':'<p>Non sono ancora state concluse sessioni.</p>')+(saved?'<p><b>È presente una sessione incompleta salvata.</b> <button class="secondary" id="resumeFromStats">Riprendi</button></p>':'')+'<h3>Backup dei dati</h3><p class="muted">Le risposte e i risultati restano in questo browser, anche dopo la chiusura. Non usiamo cookie. Se cambi dispositivo o cancelli i dati del sito, avrai bisogno di un backup.</p><div class="flex"><button id="export">Esporta backup JSON</button><label>Importa backup <input type="file" accept="application/json" id="import"></label></div></section>';
 if(saved)document.getElementById("resumeFromStats").onclick=resumeSession;
 document.getElementById("export").onclick=()=>{
  const payload={version:2,exportedAt:new Date().toISOString(),history,active:loadSnapshot()};
  const url=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:"application/json"}));
  const a=document.createElement("a");a.href=url;a.download="pecs-backup-"+new Date().toISOString().slice(0,10)+".json";a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
 };
 document.getElementById("import").onchange=async(e)=>{
  try{
   const file=e.target.files[0];if(!file)return;
   if(file.size>10000000)throw Error("Il file è troppo grande.");
   const json=JSON.parse(await file.text());
   const imported=Array.isArray(json)?json:json&&Array.isArray(json.history)?json.history:null;
   if(!imported||!imported.every(h=>h&&Array.isArray(h.questions)&&Number.isFinite(h.count)))throw Error("Cronologia non valida.");
   if(!confirm("Sostituire la cronologia salvata su questo dispositivo con quella del backup?"))return;
   history=imported;
   if(!persist())return;
   clearSnapshot();
   if(!Array.isArray(json)&&json.active&&json.active.version===1&&Array.isArray(json.active.ids)){
    try{localStorage.setItem(ACTIVE_KEY,JSON.stringify(json.active))}catch{}
   }
   stats();
  }catch(e){alert("Backup non valido: "+String(e.message||e))}
 };
}

document.getElementById("homeBtn").onclick=home;document.getElementById("practiceBtn").onclick=practice;document.getElementById("examBtn").onclick=exam;document.getElementById("errorsBtn").onclick=errors;document.getElementById("statsBtn").onclick=stats;home();
</script></body></html>
