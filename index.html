<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>PECS Lab | Allenamento INPS 2026</title>
<style>
:root{font-family:Inter,system-ui,Arial,sans-serif;color:#18243b;background:#f4f7fc}*{box-sizing:border-box}body{margin:0}header{background:#172f5f;color:#fff;padding:25px max(20px,calc((100vw - 960px)/2))}header h1{margin:0}header p{color:#ccdaf4}main{max-width:960px;margin:25px auto;padding:0 16px}.card{background:#fff;border:1px solid #dce4ef;border-radius:14px;padding:23px;margin-bottom:17px;box-shadow:0 5px 18px #14265009}.muted{color:#64748b}.pill{display:inline-block;background:#e5edf9;border-radius:40px;padding:5px 12px;font-size:12px;font-weight:650}nav{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}button,select{font:inherit}button{background:#2357bc;color:white;border:0;border-radius:9px;padding:12px 16px;cursor:pointer}button.secondary{background:#e9eef7;color:#213a63}button:disabled{opacity:.45;cursor:not-allowed}button:hover:not(:disabled){filter:brightness(.94)}button.choice{display:block;width:100%;text-align:left;background:#f5f8fc;color:#172a46;border:1px solid #d8e1ed;margin:9px 0;padding:14px}.choice.selected{background:#dceafe;border-color:#4778cf}.choice.right{background:#d8f4e5;border-color:#43916b}.choice.wrong{background:#ffe2e2;border-color:#c86666}.flex{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.space{justify-content:space-between}.bar{height:9px;background:#e3e9f2;border-radius:9px;overflow:hidden}.bar span{display:block;height:100%;background:#3977cc}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}.stat{background:#f1f6fc;border-radius:12px;padding:15px}select{padding:11px;border:1px solid #cbd5e1;border-radius:9px;max-width:100%}details{margin-top:12px}footer{max-width:960px;margin:30px auto;padding:20px;color:#718096;font-size:13px}.hidden{display:none}#timer{font-weight:750;font-variant-numeric:tabular-nums}@media(max-width:550px){header{padding:20px}main{margin:12px auto}.card{padding:16px}}
</style></head>
<body><header><h1>PECS Lab</h1><p>Preparazione al concorso INPS 1.695 PECS · 2026</p><span class="pill">Banca dati dimostrativa — quesiti non ufficiali</span></header>
<main><nav><button id="homeBtn" class="secondary">Panoramica</button><button id="practiceBtn" class="secondary">Allenamento</button><button id="examBtn" class="secondary">Simulazione</button><button id="errorsBtn" class="secondary">Ripasso errori</button><button id="statsBtn" class="secondary">Statistiche</button></nav><div id="view"></div></main>
<footer>Questo sito è indipendente dall'INPS. Le simulazioni non riproducono una banca dati ufficiale. Le risposte non vengono inviate a un server; il progresso resta nel browser.</footer>
<script src="data/questions.js"></script><script>
"use strict";
const blueprints=[["logica",15],["verbale",10],["inglese",10],["informatica",10],["cultura",15]];
const names={logica:"Logica",verbale:"Comprensione e ragionamento verbale",inglese:"Lingua inglese",informatica:"Competenze informatiche",cultura:"Cultura generale"};
const BANK=(window.PECS_QUESTIONS||[]).filter(q=>q&&q.id&&names[q.subject]&&Array.isArray(q.choices)&&q.choices.length===4&&Number.isInteger(q.correct)&&q.correct>=0&&q.correct<4);
const view=document.getElementById("view");let run=null,tick=null;
let history=(()=>{try{return JSON.parse(localStorage.getItem("pecs-history-v1"))||[]}catch{return []}})();
function persist(){try{localStorage.setItem("pecs-history-v1",JSON.stringify(history))}catch{}}
function esc(x){return String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function shuffle(a){const z=[...a];for(let i=z.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[z[i],z[j]]=[z[j],z[i]]}return z}
function stop(){if(tick)clearInterval(tick);tick=null}
function home(){stop();run=null;const counts=blueprints.map(([s,n])=>'<tr><td>'+names[s]+'</td><td>'+n+'</td><td>'+BANK.filter(q=>q.subject===s).length+'</td></tr>').join('');view.innerHTML='<section class="card"><h2>La prova preselettiva</h2><p>27–30 ottobre 2026 · 60 quesiti · 60 minuti · quattro alternative, una esatta. Seguono cinque quesiti di riserva in cinque minuti.</p><p>La banca dati attuale contiene <b>'+BANK.length+'</b> quesiti dimostrativi. Una simulazione completa si abilita solo quando ci sono abbastanza quesiti <b>unici</b> per tutte le materie.</p><table width="100%" cellspacing="12"><thead><tr><th align="left">Materia</th><th>All'esame</th><th>Disponibili</th></tr></thead><tbody>'+counts+'</tbody></table><div class="flex"><button onclick="practice()">Allenati ora</button><button class="secondary" onclick="exam()">Simulazione</button></div></section><section class="card"><h2>Prova scritta</h2><p>9 novembre 2026: tre brani tecnico-giuridici, cinque quesiti di comprensione e due scenari situazionali, con tre alternative. Occorrono almeno 21/30 in ciascuna delle due sezioni.</p><p class="muted">Modulo scritto in preparazione: non confondere questa esercitazione preselettiva con la prova scritta.</p></section>'}
function practice(){stop();run=null;view.innerHTML='<section class="card"><h2>Allenamento mirato</h2><p class="muted">Riscontro immediato e spiegazione; scegli materia e numero di quesiti.</p><div class="flex"><select id="topic"><option value="all">Tutte le materie</option>'+blueprints.map(([s])=>'<option value="'+s+'">'+names[s]+'</option>').join('')+'</select><select id="amount"><option>5</option><option selected>10</option><option>20</option><option>40</option></select><button id="startPractice">Inizia</button></div></section>';document.getElementById("startPractice").onclick=()=>{const s=document.getElementById("topic").value, n=+document.getElementById("amount").value,pool=shuffle(BANK.filter(q=>s==="all"||q.subject===s)).slice(0,n);start(pool,false)}}
function exam(){stop();run=null;const missing=blueprints.filter(([s,n])=>BANK.filter(q=>q.subject===s).length<n);view.innerHTML='<section class="card"><h2>Simulazione realistica</h2><p>60 quesiti / 60 minuti, distribuzione ufficiale 15–10–10–10–15. Cinque quesiti di riserva / cinque minuti in una fase separata.</p>'+(missing.length?'<p><b>Non ancora disponibile:</b> servono altri quesiti originali e verificati per: '+missing.map(([s,n])=>names[s]+' ('+(n-BANK.filter(q=>q.subject===s).length)+' mancanti)').join('; ')+'.</p><p class="muted">Per ora usa Allenamento: non riempiremo artificialmente la simulazione con duplicati.</p>':'<button onclick="startExam()">Avvia simulazione</button>')+'</section>'}
function startExam(){const qs=shuffle(blueprints.flatMap(([s,n])=>shuffle(BANK.filter(q=>q.subject===s)).slice(0,n)));start(qs,true)}
function start(qs,examMode){stop();if(!qs.length){view.innerHTML='<section class="card">Nessun quesito disponibile.</section>';return}run={qs,answers:{},idx:0,exam:examMode,finished:false,deadline:examMode?Date.now()+3600000:null,reserve:false};renderQuestion();if(examMode)tick=setInterval(()=>{if(run&&!run.finished){if(Date.now()>=run.deadline)finish();else{const t=document.getElementById("timer");if(t)t.textContent=clock()}}},1000)}
function clock(){return Math.max(0,Math.ceil((run.deadline-Date.now())/1000)).toString().toString().replace(/^([0-9]+)$/,(_,x)=>String(Math.floor(+x/60)).padStart(2,"0")+":"+String(+x%60).padStart(2,"0"))}
function renderQuestion(){if(!run)return;const q=run.qs[run.idx],chosen=run.answers[q.id],answered=chosen!==undefined,show=!run.exam&&answered;view.innerHTML='<section class="card"><div class="flex space"><span class="pill">'+esc(names[q.subject])+'</span><span id="timer">'+(run.exam?clock():"Allenamento")+'</span></div><h2>Quesito '+(run.idx+1)+' / '+run.qs.length+'</h2><div class="bar"><span style="width:'+((run.idx+1)/run.qs.length*100)+'%"></span></div><p style="font-size:1.13rem;line-height:1.6">'+esc(q.question)+'</p><div id="choices">'+q.choices.map((c,i)=>'<button class="choice '+(chosen===i?'selected ':'')+(show?(i===q.correct?'right':i===chosen?'wrong':''):'')+'" data-i="'+i+'" '+(show?'disabled':'')+'>'+String.fromCharCode(65+i)+'. '+esc(c)+'</button>').join('')+'</div>'+(show?'<p><b>'+(chosen===q.correct?'Corretto!':'Risposta corretta: '+String.fromCharCode(65+q.correct))+'.</b> '+esc(q.explanation||'')+'</p>':'')+'<div class="flex space"><button class="secondary" id="prev" '+(run.idx===0?'disabled':'')+'>Precedente</button><button id="next">'+(run.idx===run.qs.length-1?'Concludi':'Successivo')+'</button></div></section>';document.querySelectorAll(".choice").forEach(el=>el.onclick=()=>{run.answers[q.id]=+el.dataset.i;renderQuestion()});document.getElementById("prev").onclick=()=>{run.idx--;renderQuestion()};document.getElementById("next").onclick=()=>{if(run.idx<run.qs.length-1){run.idx++;renderQuestion()}else finish()}}
function finish(){if(!run||run.finished)return;run.finished=true;stop();const correct=run.qs.filter(q=>run.answers[q.id]===q.correct).length;const answered=run.qs.filter(q=>run.answers[q.id]!==undefined).length;history.push({date:new Date().toISOString(),mode:run.exam?"exam":"practice",count:run.qs.length,correct,answered,questions:run.qs.map(q=>({id:q.id,subject:q.subject,right:run.answers[q.id]===q.correct}))});persist();const wrong=run.qs.filter(q=>run.answers[q.id]!==q.correct);view.innerHTML='<section class="card"><h2>Risultati</h2><div class="stats"><div class="stat"><b>'+correct+' / '+run.qs.length+'</b><p>Corrette</p></div><div class="stat"><b>'+answered+'</b><p>Risposte date</p></div><div class="stat"><b>'+Math.round(100*correct/run.qs.length)+'%</b><p>Precisione</p></div></div><h3>Da ripassare</h3>'+(wrong.length?wrong.map(q=>'<details><summary>'+esc(q.question)+'</summary><p><b>'+esc(q.choices[q.correct])+'</b> — '+esc(q.explanation||'')+'</p></details>').join(''):'<p>Nessun errore.</p>')+'<div class="flex" style="margin-top:20px"><button onclick="practice()">Nuovo allenamento</button><button class="secondary" onclick="errors()">Ripasso errori</button></div></section>'}
function errors(){stop();run=null;const wrongIds=new Set(history.flatMap(h=>(h.questions||[]).filter(q=>!q.right).map(q=>q.id)));const qs=shuffle(BANK.filter(q=>wrongIds.has(q.id)));view.innerHTML='<section class="card"><h2>Ripasso errori</h2><p>'+qs.length+' quesiti sbagliati in almeno una sessione.</p><button '+(qs.length?'':'disabled')+' id="reviewStart">Ripassa ora</button></section>';document.getElementById("reviewStart").onclick=()=>start(qs,false)}
function stats(){stop();run=null;const answered=history.reduce((n,h)=>n+h.count,0),correct=history.reduce((n,h)=>n+h.correct,0);view.innerHTML='<section class="card"><h2>Statistiche locali</h2><div class="stats"><div class="stat"><b>'+history.length+'</b><p>Sessioni</p></div><div class="stat"><b>'+answered+'</b><p>Quesiti svolti</p></div><div class="stat"><b>'+(answered?Math.round(100*correct/answered):0)+'%</b><p>Precisione aggregata</p></div></div><h3>Esporta / importa</h3><p class="muted">Il progresso è conservato solo su questo dispositivo.</p><div class="flex"><button id="export">Esporta JSON</button><label>Importa JSON <input type="file" accept="application/json" id="import"></label></div></section>';document.getElementById("export").onclick=()=>{const a=document.createElement("a"),url=URL.createObjectURL(new Blob([JSON.stringify(history,null,2)],{type:"application/json"}));a.href=url;a.download="pecs-progress.json";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};document.getElementById("import").onchange=async(e)=>{try{const data=JSON.parse(await e.target.files[0].text());if(!Array.isArray(data))throw Error("Formato non valido");history=data.filter(x=>x&&Array.isArray(x.questions)&&Number.isFinite(x.count));persist();stats()}catch{alert("Il file non contiene una cronologia valida.")}}}
document.getElementById("homeBtn").onclick=home;document.getElementById("practiceBtn").onclick=practice;document.getElementById("examBtn").onclick=exam;document.getElementById("errorsBtn").onclick=errors;document.getElementById("statsBtn").onclick=stats;home();
</script></body></html>
