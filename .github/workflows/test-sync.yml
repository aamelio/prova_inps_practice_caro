name: Test GitHub progress sync
on:
  push:
    branches: [main, feat/github-progress-sync]
  pull_request:
jobs:
  progress:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-progress.mjs
      - run: node scripts/test-github-sync.mjs
